name: Bump casks

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    name: Bump
    runs-on: macos-latest
    steps:
      - name: Generate a token for the bot
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.08.10.2

      - name: Configure git as the bot
        uses: Homebrew/actions/git-user-config@2026.08.10.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          username: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Open pull requests for outdated casks
        run: brew bump --tap yuyuyuyuyu-dev/tap --cask --open-pr --no-fork
        env:
          HOMEBREW_DEVELOPER: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
