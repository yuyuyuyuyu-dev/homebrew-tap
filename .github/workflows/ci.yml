name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  style:
    name: Style
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.08.14.1

      - name: Check style
        run: brew style Casks

  audit:
    name: Audit
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.08.14.1

      - name: Audit casks
        run: brew audit --cask --strict --tap yuyuyuyuyu-dev/tap

  fetch:
    name: Fetch
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.08.14.1

      - name: Verify checksums against the published artifacts
        run: |
          for cask in Casks/*.rb; do
            brew fetch --cask "yuyuyuyuyu-dev/tap/$(basename "$cask" .rb)"
          done
